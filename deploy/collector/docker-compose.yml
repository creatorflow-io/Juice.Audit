# The audit collector with what it needs: its PostgreSQL and the RabbitMQ the apps route juice.audit to.
#   docker compose -f deploy/collector/docker-compose.yml up -d --build --wait
# The end-to-end tests (test/Juice.Audit.Tests/CollectorContainerTests.cs) run the sample app against it.
name: juice-audit-collector

services:
  postgres:
    image: postgres:17.10-alpine
    environment:
      POSTGRES_USER: audit
      POSTGRES_PASSWORD: ${AUDIT_DB_PASSWORD:-audit-local}
      POSTGRES_DB: audit
    ports:
      - "127.0.0.1:5442:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U audit -d audit"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:4.1.4-management-alpine
    ports:
      - "127.0.0.1:5682:5672"
      - "127.0.0.1:15682:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  collector:
    build:
      context: ../..
      dockerfile: src/Juice.Audit.Collector/Dockerfile
    image: juice-audit-collector:local
    # A fixed name, whatever the project name: CollectorContainerTests stops and starts it.
    container_name: juice-audit-collector
    stop_grace_period: 20s
    environment:
      ConnectionStrings__Audit: "Host=postgres;Port=5432;Database=audit;Username=audit;Password=${AUDIT_DB_PASSWORD:-audit-local}"
      Collector__Database__Provider: PostgreSQL
      Collector__RabbitMQ__Host: rabbitmq
      Collector__RabbitMQ__UserName: guest
      Collector__RabbitMQ__Password: guest
      Collector__Grpc__ApiKeys__0: ${AUDIT_COLLECTOR_KEY:-local-collector-key}
      # Open here: the ports are bound to this machine only. Behind a real network, set Collector__ReadApi__Jwt__Authority.
      Collector__ReadApi__Enabled: "true"
      Collector__ReadApi__AllowAnonymous: "true"
    ports:
      - "127.0.0.1:7290:8080"   # gRPC (HTTP/2)
      - "127.0.0.1:7291:8081"   # health, read API
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }

volumes:
  postgres-data:
